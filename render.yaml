services:
  - type: web
    name: bookvault
    env: docker
    plan: free
    branch: claude/code-study-analysis-011CV1AAxpXudZmgeBYzTh3K
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: BookVault
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://bookvault.onrender.com
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: bookvault-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bookvault-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: bookvault-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: bookvault-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bookvault-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: bookvault-db
    plan: free
    databaseName: bookvault
    user: bookvault
